# Example redis.conf for Docker Compose with Redis on port 6381

# Bind to all IP addresses
bind 0.0.0.0

# Enable protected mode
protected-mode yes

# Set the TCP backlog
tcp-backlog 511

# Set the timeout for idle connections
timeout 0

# Specify the log level (e.g., debug, verbose, notice, warning)
loglevel debug

# Specify the Redis log file path
logfile /var/log/redis/redis-server.log

# Set the maximum memory usage (optional)
# maxmemory 256mb

# Set the eviction policy (optional)
maxmemory-policy volatile-ttl

# Disable RDB snapshots
stop-writes-on-bgsave-error no

# Disable AOF persistence
appendonly no
