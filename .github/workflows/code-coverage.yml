name: Run Code Coverage

on:
  push:

env:
  keyvault_name: next-rac-vault-uat
  npm_token_secret_name: npm-token

jobs:
  nextjs-coverage:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get NPM Token
        id: getNpmToken
        uses: ./.github/actions/get-keyvault-secret
        with:
          keyvault_name: ${{ env.keyvault_name }}
          secret_name: ${{ env.npm_token_secret_name }}
          perform_azure_login: true
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up .npmrc file
        run: |
          echo "//racwa.pkgs.visualstudio.com/_packaging/racwa-design-feed/npm/registry/:username=racwa
          //racwa.pkgs.visualstudio.com/_packaging/racwa-design-feed/npm/registry/:_password=${{ steps.getNpmToken.outputs.secret }}
          //racwa.pkgs.visualstudio.com/_packaging/racwa-design-feed/npm/:username=racwa
          //racwa.pkgs.visualstudio.com/_packaging/racwa-design-feed/npm/:_password=${{ steps.getNpmToken.outputs.secret }}
          @racwa:registry=https://racwa.pkgs.visualstudio.com/_packaging/racwa-design-feed/npm/registry/
          always-auth=true" > .npmrc

      - name: Install dependencies
        run: pnpm install

      - name: Run test script defined in package.json
        run: pnpm test:ci

      - name: Run coverage script defined in package.json
        run: pnpm coverage:ci

      - name: Populate Reports Variable
        shell: pwsh
        run: |
          $ReportPaths = Get-ChildItem *cobertura*.xml -Recurse | Resolve-Path -Relative | Join-String -Separator ","
          echo "COVERAGE_REPORTS=$ReportPaths" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append

      - name: Set Env Variables for Codacy
        shell: bash
        run: |
          echo "CODACY_ORGANIZATION_PROVIDER=$(if [[ $GITHUB_SERVER_URL == "https://github.com" ]]; then echo "gh"; else echo "ghe"; fi)" >> $GITHUB_ENV
          echo "CODACY_USERNAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 1)" >> $GITHUB_ENV
          echo "CODACY_PROJECT_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)" >> $GITHUB_ENV

      - name: Create Codacy Project if necessary
        shell: pwsh
        run: |
          $headers = New-Object "System.Collections.Generic.Dictionary[[String],[String]]"
          $headers.Add("api-token", "${{ secrets.CODACY_API_TOKEN }}")
          $headers.Add("caller", "string")
          $headers.Add("Content-Type", "application/json")
          $body = @{
            repositoryFullPath = $env:GITHUB_REPOSITORY
            provider = $env:CODACY_ORGANIZATION_PROVIDER
          } | ConvertTo-Json

          Write-Host "Sending request with body: $body"
          try {
            $response = Invoke-RestMethod 'https://app.codacy.com/api/v3/repositories' -Method 'POST' -Headers $headers -Body $body -SkipHttpErrorCheck
          } catch [System.Net.WebException] {
            Write-Host "An exception was caught: $($_.Exception.Message)"
          }
          $statusCodeInt = [int]$response.BaseResponse.StatusCode
          Write-Host Response: $statusCodeInt
          Write-Host $response

          $response | ConvertTo-Json

      - name: Upload Coverage to Codacy
        shell: bash
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report --partial -l TypeScript $(find . -name '*cobertura*.xml' -printf '-r %p ')
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
  dotnet-coverage:
    uses: racwa/github-workflows/.github/workflows/codacy-dotnet-code-coverage.yml@codacy-dotnet-code-coverage/v1.0.3
    with:
      dotnet-version: 8.0.*
      runs-with: ubuntu-latest
      working-directory: ./backend
      is-partial: 'true'
    secrets:
      CODACY_API_TOKEN: ${{secrets.CODACY_API_TOKEN }}
  finalise-codacy-coverage:
    needs: [nextjs-coverage, dotnet-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Set Env Variables for Codacy
        shell: bash
        run: |
          echo "CODACY_ORGANIZATION_PROVIDER=$(if [[ $GITHUB_SERVER_URL == "https://github.com" ]]; then echo "gh"; else echo "ghe"; fi)" >> $GITHUB_ENV
          echo "CODACY_USERNAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 1)" >> $GITHUB_ENV
          echo "CODACY_PROJECT_NAME=$(echo $GITHUB_REPOSITORY | cut -d '/' -f 2)" >> $GITHUB_ENV

      - name: Finalise Codacy Coverage
        shell: bash
        run: |
          bash <(curl -Ls https://coverage.codacy.com/get.sh) final
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
