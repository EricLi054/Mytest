name: '💡 Daily Update Trivy Cache'

on:
  schedule:
    - cron: '0 23 * * 0-4' # Run Monday to Friday at 7:00AM
  workflow_dispatch:

jobs:
  update-trivy-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy Cache
        uses: ./.github/actions/trivy-cache
