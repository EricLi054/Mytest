name: Apply Terraform

inputs:
  tf_dir:
    required: true
    type: string
  tf_backend_subscription_id:
    required: true
    type: string
  tf_backend_resource_group:
    required: true
    type: string
  tf_backend_storage_account:
    required: true
    type: string
  tf_backend_container:
    required: true
    type: string
  tf_backend_key:
    required: true
    type: string
  tf_allowed_ips:
    required: false
    type: string
    default: "[]"

runs:
  using: "composite"

  steps:
    - uses: hashicorp/setup-terraform@v2
    - name: Terraform Syntax Check
      shell: bash
      continue-on-error: false
      run: terraform -chdir='${{ inputs.tf_dir }}' fmt -check

    - name: Azure Login
      uses: Azure/login@v1.1
      with:
        allow-no-subscriptions: true
        creds: ${{ env.AZURE_CREDENTIALS }}

    - name: Terraform Init
      shell: bash
      run: terraform -chdir='${{ inputs.tf_dir }}' init -backend-config="subscription_id=${{ inputs.tf_backend_subscription_id }}" -backend-config="resource_group_name=${{ inputs.tf_backend_resource_group }}" -backend-config="storage_account_name=${{ inputs.tf_backend_storage_account }}" -backend-config="container_name=${{ inputs.tf_backend_container }}" -backend-config="key=${{ inputs.tf_backend_key }}"
      
    - name: Terraform Validation Check
      shell: bash
      continue-on-error: false
      run: terraform -chdir='${{ inputs.tf_dir }}' validate
    
    # Add check here to not apply empty plan
    - name: Terraform Apply
      shell: bash
      env:
        TF_VAR_allowed_ips: ${{ inputs.tf_allowed_ips }}
      run: terraform -chdir='${{ inputs.tf_dir }}' apply -input=false -auto-approve

    - name: Azure Logout & Cleanup
      uses: azure/CLI@v1
      with:
        azcliversion: 2.0.72
        inlineScript: |
          az logout
          az cache purge
          az account clear

