name: Prefetch Pnpm

inputs:
  working_dir:
    required: true
    type: string

runs:
  using: 'composite'

  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Use Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: 18
        cache: 'pnpm'
        cache-dependency-path: '${{ inputs.working_dir }}/pnpm-lock.yaml'

    - name: Install dependencies
      shell: bash
      run: pnpm install --dir ${{ inputs.working_dir }}
