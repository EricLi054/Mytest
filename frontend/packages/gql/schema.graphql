input horizons_ImageTransformOptions {
  """Desired width in pixels. Defaults to the original image width."""
  width: horizons_Dimension

  """Desired height in pixels. Defaults to the original image height."""
  height: horizons_Dimension

  """
  Desired quality of the image in percents.
          Used for `PNG8`, `JPG`, `JPG_PROGRESSIVE` and `WEBP` formats.
  """
  quality: horizons_Quality

  """
  Desired corner radius in pixels.
          Results in an image with rounded corners (pass `-1` for a full circle/ellipse).
          Defaults to `0`. Uses desired background color as padding color,
          unless the format is `JPG` or `JPG_PROGRESSIVE` and resize strategy is `PAD`, then defaults to white.
  """
  cornerRadius: Int

  """Desired resize strategy. Defaults to `FIT`."""
  resizeStrategy: horizons_ImageResizeStrategy

  """Desired resize focus area. Defaults to `CENTER`."""
  resizeFocus: horizons_ImageResizeFocus

  """
  Desired background color, used with corner radius or `PAD` resize strategy.
          Defaults to transparent (for `PNG`, `PNG8` and `WEBP`) or white (for `JPG` and `JPG_PROGRESSIVE`).
  """
  backgroundColor: horizons_HexColor

  """Desired image format. Defaults to the original image format."""
  format: horizons_ImageFormat
}

