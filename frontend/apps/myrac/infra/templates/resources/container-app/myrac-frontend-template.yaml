myrac-frontend:
  resourceGroupName: rg-next-rac-com-au-${{ env }}
  managedEnvironmentName: next-rac-env-${{ env }}
  keyVaultName: next-rac-vault-${{ env }}
  appConfigName: next-rac-appconfig-${{ env }}
  appInsightsName: next-rac-app-insights-${{ env }}
  tags: {}
  properties:
    workloadProfileName: Consumption
    configuration:
      secrets:
        - name: azure-ad-b2c-client-secret
      environmentVariables: []
      activeRevisionsMode: Single
      ingress:
        external: true
        targetPort: 3000
        traffic:
          - weight: 100
            latestRevision: true
        ipSecurityRestrictions: []
      dapr:
        enabled: false
        appId: frontend
        appProtocol: http
        appPort: 3000
    template:
      revisionSuffix: ''
      terminationGracePeriodSeconds:
      containers:
        - image: racwa.azurecr.io/rac-digital/myrac-frontend
          name: myrac-frontend
          env: []
          resources:
            cpu: 1
            memory: 2Gi
            ephemeralStorage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
          probes:
            - type: Liveness
              failureThreshold: 10
              httpGet:
                path: /api/healthz/liveness
                port: 3000
                scheme: HTTP
              initialDelaySeconds: 3
              periodSeconds: 10
              timeoutSeconds: 1
            - type: Readiness
              failureThreshold: 10
              httpGet:
                path: /api/healthz/readiness
                port: 3000
                scheme: HTTP
              periodSeconds: 10
              successThreshold: 3
              timeoutSeconds: 1
            - type: Startup
              failureThreshold: 3
              httpGet:
                path: /api/healthz/startup
                port: 3000
                scheme: HTTP
              periodSeconds: 10
              timeoutSeconds: 1
      initContainers:
      scale:
        minReplicas: 0
        maxReplicas: 1
        rules:
          - name: http-scaler
            http:
              metadata:
                concurrentRequests: 100
